<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src http://localhost:8000 ws://localhost:8000; style-src 'self' 'unsafe-inline'; media-src 'self' file: blob:; worker-src 'none'" />
  <title>Sonorus</title>
  <link rel="icon" href="../assets/logo.png" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/import.css" />
  <link rel="stylesheet" href="styles/editor.css" />
  <link rel="stylesheet" href="styles/settings.css" />
  <link rel="stylesheet" href="styles/speakers.css" />
  <link rel="stylesheet" href="styles/views.css" />
  <link rel="stylesheet" href="styles/modal.css" />
</head>
<body>

  <!-- Custom titlebar (replaces native OS titlebar) -->
  <div id="titlebar">

    <!-- Left section — aligns with sidebar width -->
    <div class="tb-left">
      <img src="../assets/logo.png" class="tb-logo" alt="Sonorus" />
    </div>

    <!-- Nav — back, left of search -->
    <div class="tb-nav">
      <button class="tb-tool" id="tb-back" title="Back">
        <span data-icon="arrow-left" data-size="16"></span>
      </button>
    </div>

    <!-- Center — centered in the middle grid column -->
    <button class="tb-search" id="tb-search-btn" title="Search (⌘F)">
      <span data-icon="search" data-size="13"></span>
      <span class="tb-search-label">Search transcripts…</span>
      <span class="tb-search-kbd">⌘F</span>
    </button>

    <!-- Right section — utility buttons -->
    <div class="tb-right">
      <button class="tb-tool" id="tb-export" data-tooltip="Copy to clipboard">
        <span data-icon="copy" data-size="15"></span>
      </button>
      <button class="tb-tool" id="tb-share" data-tooltip="Share">
        <span data-icon="share" data-size="16"></span>
      </button>

      <div class="tb-sep" id="tb-sep-record" style="display:none"></div>

      <button class="tb-record" id="tb-record" style="display:none">
        <span class="tb-rec-dot"></span>
        <span id="tb-record-label">Record</span>
      </button>

      <div class="tb-sep"></div>

      <button class="tb-tool" id="tb-inspector-toggle" title="Toggle inspector">
        <span data-icon="inspector" data-size="15"></span>
      </button>

      <div class="tb-sep"></div>

      <button class="tb-tool" id="btn-settings" title="Settings">
        <span data-icon="settings" data-size="16"></span>
      </button>
    </div>

  </div>

  <div id="app">
  <div id="app-row">
    <aside id="sidebar">

      <!-- Header: section tabs + New -->
      <div class="sb-header">
        <div class="sb-tabs" id="sb-tabs" role="tablist">
          <button class="sb-tab sb-tab--active" data-section="transcripts" role="tab" aria-selected="true">
            Transcripts <span class="sb-header-count" id="sb-header-count"></span>
          </button>
          <button class="sb-tab" data-section="speakers" role="tab" aria-selected="false">
            Speakers <span class="sb-header-count" id="sb-speakers-count"></span>
          </button>
        </div>
        <div style="flex:1"></div>
        <button class="sb-hdr-btn" id="btn-import" title="New recording">
          <span data-icon="add" data-size="16"></span>
        </button>
      </div>

      <!-- Transcripts section -->
      <div class="sb-pane" id="sb-pane-transcripts">
        <!-- Filter chips (segmented control) -->
        <div class="sb-filter-wrap">
          <div class="sb-filter-seg" id="sb-filter">
            <button class="sb-filter-btn sb-filter-btn--active" data-filter="all">
              All <span class="sb-filter-count" id="filter-count-all"></span>
            </button>
            <button class="sb-filter-btn" data-filter="recordings">Rec.</button>
            <button class="sb-filter-btn" data-filter="notes">Notes</button>
            <button class="sb-filter-btn" data-filter="marked">Marked</button>
          </div>
        </div>

        <!-- Active transcription jobs -->
        <div id="job-queue" style="display:none"></div>

        <!-- Recordings list -->
        <div id="recordings-list" class="sb-list quiet-scroll"></div>
      </div>

      <!-- Speakers section -->
      <div class="sb-pane" id="sb-pane-speakers" hidden>
        <div class="sb-search-wrap">
          <span class="sb-search-icon" data-icon="search" data-size="13"></span>
          <input class="sb-search" id="speaker-search" type="search" placeholder="Search speakers" autocomplete="off" />
        </div>
        <div class="sb-filter-wrap">
          <div class="sb-filter-seg" id="sb-speaker-filter">
            <button class="sb-filter-btn sb-filter-btn--active" data-filter="all">
              All <span class="sb-filter-count" id="speaker-count-all"></span>
            </button>
            <button class="sb-filter-btn" data-filter="named">
              Named <span class="sb-filter-count" id="speaker-count-named"></span>
            </button>
            <button class="sb-filter-btn" data-filter="unnamed">
              Unnamed <span class="sb-filter-count" id="speaker-count-unnamed"></span>
            </button>
          </div>
        </div>
        <div id="speakers-list" class="sb-list quiet-scroll"></div>
      </div>

    </aside>

    <main id="main-panel">
      <!-- views are rendered here -->
    </main>
  </div>
  <div id="player-slot"></div>
  </div>

  <script src="icons.js"></script>
  <script src="utils.js"></script>
  <script src="not-implemented.js"></script>
  <script src="components.js"></script>
  <script src="data.js"></script>
  <script src="views/alignment-modal.js"></script>
  <script src="views/editor/tooltip.js"></script>
  <script src="views/editor/new-speaker-modal.js"></script>
  <script src="views/editor/speaker-picker.js"></script>
  <script src="views/editor/segment-row.js"></script>
  <script src="views/editor/speaker-card.js"></script>
  <script src="views/editor/waveform.js"></script>
  <script src="views/editor/player-bar.js"></script>
  <script src="views/editor/right-panel.js"></script>
  <script src="views/editor-view.js"></script>
  <script src="views/settings-view.js"></script>
  <script src="views/speakers-view.js"></script>
  <script src="views/new-recording-modal.js"></script>
  <script src="views/queue-job-modal.js"></script>
  <script src="file-drop.js"></script>
  <script src="toast.js"></script>
  <script src="app.js"></script>
</body>
</html>
