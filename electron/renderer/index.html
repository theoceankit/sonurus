<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; connect-src http://localhost:8000 ws://localhost:8000; style-src 'self' 'unsafe-inline'" />
  <title>Whisper</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Custom titlebar (replaces native OS titlebar) -->
  <div id="titlebar">

    <!-- Left section — aligns with sidebar width -->
    <div class="tb-left"></div>

    <!-- Nav — back/forward, left of search -->
    <div class="tb-nav">
      <button class="tb-tool" id="tb-back" title="Back">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M9 3l-4 4 4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <button class="tb-tool" id="tb-forward" title="Forward" disabled>
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Center — centered in the middle grid column -->
    <button class="tb-search" id="tb-search-btn" title="Search (⌘F)">
      <svg width="11" height="11" viewBox="0 0 13 13" fill="none">
        <circle cx="5.5" cy="5.5" r="4" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8.5 8.5l3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span class="tb-search-label">Search transcripts…</span>
      <span class="tb-search-kbd">⌘F</span>
    </button>

    <!-- Right section — utility buttons -->
    <div class="tb-right">
      <button class="tb-tool" id="tb-export" data-tooltip="Copy to clipboard">
        <svg width="13" height="14" viewBox="0 0 13 14" fill="none">
          <rect x="4.5" y="3.5" width="7" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/>
          <path d="M3 10H2a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1h5.5a1 1 0 0 1 1 1v1" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="tb-tool" id="tb-share" data-tooltip="Share">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M7 1.5v8M4 4l3-3 3 3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2.5 9v3.5h9V9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="tb-sep"></div>

      <button class="tb-record" id="tb-record">
        <span class="tb-rec-dot"></span>
        Record
      </button>

      <div class="tb-sep"></div>

      <button class="tb-tool" id="tb-inspector-toggle" title="Toggle inspector">
        <svg width="14" height="13" viewBox="0 0 16 14" fill="none">
          <rect x="1.5" y="2" width="13" height="10" rx="2" stroke="currentColor" stroke-width="1.3"/>
          <line x1="10" y1="2" x2="10" y2="12" stroke="currentColor" stroke-width="1.3"/>
        </svg>
      </button>

      <div class="tb-sep"></div>

      <button class="tb-tool" id="btn-settings" title="Settings">
        <svg width="13" height="13" viewBox="0 0 17 17" fill="none">
          <circle cx="8.5" cy="8.5" r="2.5" stroke="currentColor" stroke-width="1.4" fill="none"/>
          <path d="M8.5 1.5v2M8.5 13.5v2M1.5 8.5h2M13.5 8.5h2
                   M3.5 3.5l1.4 1.4M12.1 12.1l1.4 1.4
                   M3.5 13.5l1.4-1.4M12.1 4.9l1.4-1.4"
                stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

  </div>

  <div id="app">
  <div id="app-row">
    <aside id="sidebar">

      <!-- Header: title + count + Sort + New -->
      <div class="sb-header">
        <span class="sb-header-title">Transcripts</span>
        <span class="sb-header-count" id="sb-header-count"></span>
        <div style="flex:1"></div>
        <button class="sb-hdr-btn" id="btn-sort" title="Sort by date">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
            <path d="M2.5 4h9M4 7h6M5.5 10h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="sb-hdr-btn" id="btn-import" title="New recording">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
            <path d="M7 2v10M2 7h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

<!-- Filter chips (segmented control) -->
      <div class="sb-filter-wrap">
        <div class="sb-filter-seg" id="sb-filter">
          <button class="sb-filter-btn sb-filter-btn--active" data-filter="all">
            All <span class="sb-filter-count" id="filter-count-all"></span>
          </button>
          <button class="sb-filter-btn" data-filter="recordings">Rec.</button>
          <button class="sb-filter-btn" data-filter="notes">Notes</button>
          <button class="sb-filter-btn" data-filter="marked">Marked</button>
        </div>
      </div>

      <!-- Recordings list -->
      <div id="recordings-list" class="sb-list quiet-scroll"></div>


    </aside>

    <main id="main-panel">
      <!-- views are rendered here -->
    </main>
  </div>
  <div id="player-slot"></div>
  </div>

  <script src="utils.js"></script>
  <script src="components.js"></script>
  <script src="data.js"></script>
  <script src="views/import-view.js"></script>
  <script src="views/progress-view.js"></script>
  <script src="views/editor-view.js"></script>
  <script src="views/settings-view.js"></script>
  <script src="views/live-recording-view.js"></script>
  <script src="views/new-recording-modal.js"></script>
  <script src="app.js"></script>
</body>
</html>
