name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # Manual run from any branch: builds and uploads the installers as workflow
  # artifacts; the draft release is created only for tags.
  workflow_dispatch:

permissions:
  contents: write

# Installers carry every Python library (scripts/bundle-backend.js installs
# them from locks/); the pip cache keeps those downloads between runs.
env:
  PIP_CACHE_DIR: ${{ github.workspace }}/.pip-cache

jobs:
  # ── macOS arm64 (Apple Silicon) ──────────────────────────────────────────────
  build-mac:
    timeout-minutes: 60
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build sonorus-capture binary
        run: npm run build:capture

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: .pip-cache
          key: ${{ runner.os }}-pip-packaged-${{ hashFiles('locks/**') }}
          restore-keys: |
            ${{ runner.os }}-pip-packaged-

      - name: Bundle Python backend
        run: node scripts/bundle-backend.js

      - name: Build Electron app
        run: npx electron-builder --mac --arm64 --publish never

      - name: Check installer size
        run: node scripts/check-installer-size.js dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

  # ── Windows x64 ──────────────────────────────────────────────────────────────
  build-win:
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: .pip-cache
          key: ${{ runner.os }}-pip-packaged-${{ hashFiles('locks/**') }}
          restore-keys: |
            ${{ runner.os }}-pip-packaged-

      - name: Bundle Python backend
        run: node scripts/bundle-backend.js

      - name: Build Electron app
        run: npx electron-builder --win --x64 --publish never

      - name: Check installer size
        run: node scripts/check-installer-size.js dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-win
          path: dist/*.exe
          if-no-files-found: error

  # ── Linux x64 ────────────────────────────────────────────────────────────────
  build-linux:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: .pip-cache
          key: ${{ runner.os }}-pip-packaged-${{ hashFiles('locks/**') }}
          restore-keys: |
            ${{ runner.os }}-pip-packaged-

      - name: Bundle Python backend
        run: node scripts/bundle-backend.js

      - name: Build Electron app
        run: npx electron-builder --linux --x64 --publish never

      - name: Check installer size
        run: node scripts/check-installer-size.js dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/*.AppImage
          if-no-files-found: error

  # ── Draft release ─────────────────────────────────────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          artifacts: "artifacts/*"
          draft: true
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}
