name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install UI dependencies
        run: npm --prefix ui ci

      # pytest checks the schema against the code, this the types against the schema.
      - name: Check generated API types
        run: |
          npm --prefix ui/tools/openapi-types ci
          npm --prefix ui/tools/openapi-types run check

      - name: Check UI types
        run: npm --prefix ui run typecheck

      - name: Run UI tests
        run: npm --prefix ui test

      - name: Build UI
        run: npm --prefix ui run build

      - name: Run Electron tests
        run: node --test 'tests/electron/*.test.js'

      - name: Run build tests
        run: node --test 'tests/build/*.test.js'
